interface:
  display_name: "Structured Extraction"
  short_description: "Extract structured data from browser pages"
  default_prompt: "Use $xgen-structured-extraction to extract this page into structured data."

dependencies:
  tools:
    - type: "mcp"
      value: "xgen_browser"
      description: "Read-only page extraction backed by agent-browser"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
